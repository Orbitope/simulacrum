[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulacrum"
version = "0.1.0"
description = "Framework for developing RL environments as batched tensor simulations, validated by differential testing against readable reference implementations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew Burke" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "jsonschema>=4.20",
    "pytest>=8.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]

[project.scripts]
simulacrum = "simulacrum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["simulacrum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
